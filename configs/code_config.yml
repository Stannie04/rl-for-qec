#
# LDPC codes.
#

144_12_12_ldpc:
  code_type: ldpc
  n: 144
  k: 12
  d: 12

  l: 6
  m: 12

  code_params:
    A: [[3,0,0], [0,1,0], [0,2,0]] # x^3 + y + y^2
    B: [[0,3,0], [1,0,0], [2,0,0]] # y^3 + x + x^2


18_4_4_ldpc:
  code_type: ldpc
  n: 18
  k: 4
  d: 4

  l: 3
  m: 3

  code_params:
    A: [[1,0,0], [0,0,0], [0,2,0]] # x + y^2 + 1
    B: [[0,1,0], [0,0,0], [2,0,0]] # y + x^2 + 1


30_4_5_ldpc:
    code_type: ldpc
    n: 30
    k: 4
    d: 5

    l: 3
    m: 5

    code_params:
        A: [[1,0,0], [0,0,4]] # x + z^4
        B: [[1,0,0], [0,2,0], [0,0,2]] # x+ y^2 + z^2


72_4_8_ldpc:
    code_type: ldpc
    n: 72
    k: 4
    d: 8

    l: 4
    m: 9

    code_params:
        A: [[1,0,0], [0,3,0]] # x + y^3
        B: [[2,0,0], [0,1,0], [0,2,0]] # x^2 + y + y^2


#
# Tile codes: planar L x L grid with two qubits per site (see src/environment/tile_code.py).
#

288_8_12_tile:
  code_type: tile
  n: 288
  k: 8
  d: 12

  L: 12

  code_params:
    x_tile: {L: [[1,0],[2,0],[0,2]], R: [[2,1],[2,2],[0,0]]}   # f = x + x^2 + y^2, g = 1 + x^2 y + x^2 y^2
    z_tile: {L: [[2,2],[0,1],[0,0]], R: [[1,2],[0,2],[2,0]]}   # gbar, fbar (Liang & Chen, arXiv:2504.08887)


#
# Toric codes.
#

18_2_3_toric:
  code_type: toric
  n: 18
  k: 2
  d: 3

  l: 3
  m: 3

  code_params:
    A: [[1,0,0], [0,0,0]] # x + 1
    B: [[0,1,0], [0,0,0]] # y + 1


128_2_8_toric:
  code_type: toric
  n: 128
  k: 2
  d: 8

  l: 8
  m: 8

  code_params:
    A: [[0,0,0], [1,0,0]]
    B: [[0,0,0], [0,1,0]]


288_2_12_toric:
  code_type: toric
  n: 288
  k: 2
  d: 12

  l: 12
  m: 12

  code_params:
    A: [[0,0,0], [1,0,0]]   # 1 + x
    B: [[0,0,0], [0,1,0]]   # 1 + y


800_2_20_toric:
  code_type: toric
  n: 800
  k: 2
  d: 20

  l: 20
  m: 20

  code_params:
    A: [[0,0,0], [1,0,0]]   # 1 + x
    B: [[0,0,0], [0,1,0]]   # 1 + y


