sac:
  batch_size: 128
  replay_buffer_capacity: 500000
  initial_alpha: 0.1
  entropy_factor: 0.5
  gamma: 0.99
  tau: 0.005

  hidden_layers_cgnn:
    - 32
    - 128
    - 256
    - 512
    - 512
    - 256
    - 256

  # Used for the dueling MLPs + GRU in the neural BP decoder
  neural_bp_iterations: 4
  neural_bp_hidden_dim: 32

  hidden_layers_mlp:
    - 256
    - 128
    - 64
    - 32

  train_frequency: 1

  actor_learning_rate: 0.0001
  critic_learning_rate: 0.0003
  alpha_learning_rate: 0.0001

  use_neural_bp: True
  use_per: True

moe:
  moe_experts:
    - bp
    - rl_nbp

  moe_hidden_layers_cgnn:
    - 32
    - 128
    - 256
    - 512
    - 512
    - 256
    - 256

  moe_hidden_layers_mlp:
#    - 256
#    - 128
    - 64
    - 32

  router_sl_test_fraction: 0.2
  router_sl_batch_size: 128
  router_sl_learning_rate: 0.0002
  moe_learning_rate: 0.0001
  latency_penalty_factor: 10 # 0 for no penalty

encoder:
  encoder_learning_rate: 0.0001
  encoder_hidden_dim: 128